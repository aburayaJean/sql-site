baseURL = "https://aburayaJean.github.io/sql-site/"
languageCode = "pt-BR"
title = "SQL with Jean"
theme = "hextra"
defaultContentLanguage = "pt"
enableRobotsTXT = true
enableGitInfo = true

# Permite HTML cru no Markdown (botões, <details> etc.)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "SQL Server do zero ao plano de execução. Posts com conceito e prática, scripts prontos e um mapa com tudo o que vem pela frente."
  displayUpdatedDate = false
  dateFormat = "02/01/2006"

  [params.navbar]
    displayTitle = true
    displayLogo = false
    widthClass = "max-w-screen-xl"

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = "normal"

  [params.search]
    enable = true
    type = "flexsearch"

  [params.highlight]
    enable = true
    copy = true
    copyNotification = true

[menu]
  [[menu.main]]
    name = "Comece aqui"
    pageRef = "/fundamentos/por-onde-comecar/o-que-e-um-banco-de-dados"
    weight = 10

  [[menu.main]]
    name = "Mapa"
    pageRef = "/mapa"
    weight = 20

  [[menu.main]]
    name = "Scripts"
    pageRef = "/scripts"
    weight = 30

  [[menu.main]]
    name = "Downloads"
    pageRef = "/downloads"
    weight = 40

  [[menu.main]]
    name = "Contato"
    pageRef = "/contato"
    weight = 50

  [[menu.main]]
    name = "Buscar"
    weight = 60
    [menu.main.params]
      type = "search"

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/aburayaJean/sql-site"
    weight = 70
    [menu.main.params]
      type = "icon"
      icon = "github"
